name: Documentation Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      local_preview:
        description: Build a preview of trusted main on the Windows runner (no deployment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}-${{ inputs.local_preview && 'preview' || 'site' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.local_preview && '{"group":"darbotlm-win11-private","labels":["self-hosted","Windows","X64","dotnet11"]}' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.local_preview
        with:
          name: documentation-preview
          path: website/build
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main' && !inputs.local_preview && github.event_name != 'pull_request'
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.local_preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
